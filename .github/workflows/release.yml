name: Release

# 打 v* tag 即自动构建 macOS .app 并挂到 GitHub Release。
# 此前发版纯手动，且 v0.1.0 是在 CI 长期失败期间构建的；此 workflow 保证
# Release 产物必然经过冒烟自检。签名与公证仍由维护者手动完成
# （见 packaging/README.md），CI 只产出 ad-hoc 签名的包。
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-release:
    runs-on: macos-14
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install build deps
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller "PySide6>=6.5" "pandas>=2.0,<4" "PyYAML>=6.0"
          git clone --quiet https://github.com/ZengZichao/PyiTOL.git ../PyiTOL
          # 与 CI test job 的引擎 commit 保持一致（升级时两处一起改）。
          git -C ../PyiTOL checkout --quiet 10b531ab5aaa5178496a05425b1ed1fc4ed59d86
          test -f ../PyiTOL/pyproject.toml || { echo "::error::PyiTOL 仓库根缺少 pyproject.toml，路径假设已失效"; exit 1; }
          pip install ../PyiTOL
      - name: Build .app
        run: pyinstaller packaging/pyitolstudio.spec --noconfirm
      - name: Smoke test the bundle
        env:
          PYITOLSTUDIO_SMOKE: "1"
        run: |
          set -uo pipefail
          APP="dist/PyiTOL Studio.app"
          test -d "$APP" || { echo "::error::未产出 $APP"; ls -la dist/ || true; exit 1; }
          "$APP/Contents/MacOS/PyiTOL Studio"
      - name: Zip the bundle
        # .app 是目录，GitHub Release 只能挂单文件；用 ditto 保留 macOS 元数据
        # （--sequesterRsrc --keepParent 是分发 .app 的标准做法）。
        run: |
          ditto -c -k --sequesterRsrc --keepParent \
            "dist/PyiTOL Studio.app" "PyiTOL-Studio-${GITHUB_REF_NAME}-macos.zip"
      - name: Create GitHub Release and upload artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --verify-tag --generate-notes \
            "PyiTOL-Studio-${GITHUB_REF_NAME}-macos.zip"
