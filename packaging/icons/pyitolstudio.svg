<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#35e0a1"/>
      <stop offset="1" stop-color="#22c98c"/>
    </linearGradient>
    <linearGradient id="bgLight" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0e9c68"/>
      <stop offset="1" stop-color="#0b7d54"/>
    </linearGradient>
  </defs>
  <!-- Rounded square background (macOS squircle approximation) -->
  <rect x="64" y="64" width="896" height="896" rx="224" ry="224" fill="url(#bg)"/>
  <!-- Tree icon (stylized phylogenetic tree) in white -->
  <g fill="none" stroke="#04160e" stroke-width="48" stroke-linecap="round" stroke-linejoin="round" transform="translate(0, 20)">
    <!-- Main trunk -->
    <path d="M 512 240 L 512 380"/>
    <!-- Left branch -->
    <path d="M 512 380 Q 350 380 350 520 L 350 640"/>
    <!-- Right branch -->
    <path d="M 512 380 Q 674 380 674 520 L 674 640"/>
    <!-- Left sub-branches -->
    <path d="M 350 520 Q 250 520 250 640 L 250 760"/>
    <path d="M 350 520 Q 420 520 420 640 L 420 760"/>
    <!-- Right sub-branches -->
    <path d="M 674 520 Q 600 520 600 640 L 600 760"/>
    <path d="M 674 520 Q 780 520 780 640 L 780 760"/>
    <!-- Leaf nodes (circles) -->
    <circle cx="250" cy="780" r="28" fill="#04160e" stroke="none"/>
    <circle cx="420" cy="780" r="28" fill="#04160e" stroke="none"/>
    <circle cx="600" cy="780" r="28" fill="#04160e" stroke="none"/>
    <circle cx="780" cy="780" r="28" fill="#04160e" stroke="none"/>
  </g>
</svg>
