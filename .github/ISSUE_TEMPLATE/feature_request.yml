name: "Feature request / 功能建议"
description: "提出改进或新功能 / Suggest an idea for this project"
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: 想解决的问题 / The problem this addresses
      description: 这个功能帮助你完成什么科研/注释工作？
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: 期望的方案 / Proposed solution
  - type: textarea
    id: alternatives
    attributes:
      label: 备选方案 / Alternatives considered
  - type: textarea
    id: context
    attributes:
      label: 补充信息 / Additional context
      description: iTOL 官方格式相关约束、示例文件等。
