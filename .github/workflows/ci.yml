name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - run: pip install ruff
      - name: Ruff (fast, non-blocking style gate)
        run: ruff check src --select E,F,W,B,I --output-format=github || true

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install PySide6 "pandas>=2.0,<4" PyYAML pytest pytest-qt
      - name: Install Qt runtime libs (Linux)
        # pytest-qt 在 pytest_configure 阶段就 import QtGui，缺 OpenGL 共享库会
        # 直接 INTERNALERROR，一个测试都跑不起来：
        #   ImportError: libEGL.so.1: cannot open shared object file
        # Ubuntu runner 默认不含这些系统库，macOS runner 不需要。
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libglib2.0-0 libdbus-1-3 libxkbcommon-x11-0 \
            libxcb-cursor0 libxcb-icccm4 libxcb-keysyms1 libxcb-shape0 \
            libxcb-randr0 libxcb-render-util0 libxcb-xinerama0
      - name: Fetch the pyitol engine (distributed with the PyiTOL repo)
        run: |
          git clone --depth 1 https://github.com/ZengZichao/PyiTOL.git ../PyiTOL
          # 引擎的 pyproject.toml 位于 PyiTOL 仓库根（不存在 PyiTOL-项目代码 子目录）。
          echo "PYITOL_ENGINE_ROOT=$PWD/../PyiTOL" >> "$GITHUB_ENV"
          echo "PYITOL_ENGINE_SRC=$PWD/../PyiTOL/src" >> "$GITHUB_ENV"
          echo "PYTHONPATH=$PWD/src:$PWD/../PyiTOL/src" >> "$GITHUB_ENV"
      - name: Install engine runtime deps
        run: pip install dendropy
      - name: Run tests (offscreen)
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -q

  build-macos:
    # Produces a local ad-hoc-signed .app artifact for manual Gatekeeper-free
    # testing. Release signing + notarization are done by a maintainer (see
    # packaging/README.md), NOT in CI.
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install build deps
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller PySide6 "pandas>=2.0,<4" PyYAML
          git clone --depth 1 https://github.com/ZengZichao/PyiTOL.git ../PyiTOL
          # 引擎的 pyproject.toml 位于 PyiTOL 仓库根。原先指向的
          # PyiTOL-项目代码 子目录并不存在，pip 报
          #   Invalid requirement: '../PyiTOL/PyiTOL-项目代码'
          #   Expected package name at the start of dependency specifier
          # pip 要求路径参数是含 pyproject.toml/setup.py 的项目目录，故传仓库根。
          test -f ../PyiTOL/pyproject.toml || { echo "::error::PyiTOL 仓库根缺少 pyproject.toml，路径假设已失效"; exit 1; }
          pip install ../PyiTOL
      - name: Build .app
        run: pyinstaller packaging/pyitolstudio.spec --noconfirm
      - name: Smoke test the bundle
        env:
          PYITOLSTUDIO_SMOKE: "1"
        # app 名含空格，必须加引号；此前 shell 把 "dist/PyiTOL Studio.app/..."
        # 按空格切成 "dist/PyiTOL" + "Studio.app/..."，报
        #   dist/PyiTOL: No such file or directory
        # smoke 模式走 main._smoke()，内部是一串 assert，失败时以非 0 退出。
        run: |
          set -uo pipefail
          APP="dist/PyiTOL Studio.app"
          test -d "$APP" || { echo "::error::未产出 $APP"; ls -la dist/ || true; exit 1; }
          "$APP/Contents/MacOS/PyiTOL Studio"
          rc=$?
          echo "smoke test exit code: $rc"
          exit $rc
      - uses: actions/upload-artifact@v4
        with:
          name: PyiTOL-Studio-macos
          path: dist/PyiTOL Studio.app
