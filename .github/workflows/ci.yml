name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# 同一分支/PR 的新推送取消仍在跑的旧运行：本流水线最长 1h+（build-macos），
# 不加 concurrency 时一次 PR 连续推几个 commit 就要排队数小时。
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    # 规则集与 line-length 单一来源：pyproject.toml 的 [tool.ruff]
    # （select E,F,W,B,I；line-length 120）。历史上这里的 `|| true`
    # 让 lint 永不失败、形同虚设；现在是阻断式门槛。
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # pin 到具体 commit（防 tag 被劫持）；版本见行尾注释，升级由 Dependabot 提 PR。
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
      - run: pip install "ruff==0.15.*"
      - name: Ruff（阻断式）
        run: ruff check src tests scripts

  test:
    name: test (${{ matrix.os }}, py${{ matrix.python }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        # requires-python >=3.10：下限 3.10 与当前 3.13 都要覆盖（此前只测 3.11）。
        python: ["3.10", "3.11", "3.13"]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install dependencies
        # 版本下界与 pyproject 的 dependencies/[dev] 对齐，避免"CI 装的和声明的不是一套"。
        run: |
          python -m pip install --upgrade pip
          pip install "PySide6>=6.5" "pandas>=2.0,<4" "PyYAML>=6.0" "pytest>=7" "pytest-qt>=4.2"
      - name: Install Qt runtime libs (Linux)
        # pytest-qt 在 pytest_configure 阶段就 import QtGui，缺 OpenGL 共享库会
        # 直接 INTERNALERROR，一个测试都跑不起来：
        #   ImportError: libEGL.so.1: cannot open shared object file
        # Ubuntu runner 默认不含这些系统库，macOS runner 不需要。
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libglib2.0-0 libdbus-1-3 libxkbcommon-x11-0 \
            libxcb-cursor0 libxcb-icccm4 libxcb-keysyms1 libxcb-shape0 \
            libxcb-randr0 libxcb-render-util0 libxcb-xinerama0
      - name: Fetch the pyitol engine (distributed with the PyiTOL repo)
        # 固定到 PyiTOL main 的具体 commit：不再用 --depth 1 追可变的默认分支——
        # 引擎仓库一有推送本仓库 CI 就会被连带打碎（本仓库曾因此坏了数周）。
        # 升级引擎 = 有意识地改这个 SHA，并与 pyproject 的 pyitol>=1.0.3 一起核对。
        run: |
          git clone --quiet https://github.com/ZengZichao/PyiTOL.git ../PyiTOL
          git -C ../PyiTOL checkout --quiet 10b531ab5aaa5178496a05425b1ed1fc4ed59d86
          # 引擎的 pyproject.toml 位于 PyiTOL 仓库根（不存在 PyiTOL-项目代码 子目录）。
          echo "PYITOL_ENGINE_ROOT=$PWD/../PyiTOL" >> "$GITHUB_ENV"
          echo "PYITOL_ENGINE_SRC=$PWD/../PyiTOL/src" >> "$GITHUB_ENV"
          echo "PYTHONPATH=$PWD/src:$PWD/../PyiTOL/src" >> "$GITHUB_ENV"
      - name: Install engine runtime deps
        run: pip install dendropy
      - name: Run tests (offscreen)
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -q

  build-macos:
    # Produces a local ad-hoc-signed .app artifact for manual Gatekeeper-free
    # testing. Release signing + notarization are done by a maintainer (see
    # packaging/README.md), NOT in CI.
    # 不再在每次 PR 上跑：PyInstaller 冷装 PySide6 约 1 小时，把 PR CI 拖到
    # 1.5h+。PR 只跑 lint+test；构建验证移到 merge 后的 main 与 tag/手动触发
    # （正式发版产物由 release.yml 产出）。
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: macos-14
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install build deps
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller "PySide6>=6.5" "pandas>=2.0,<4" "PyYAML>=6.0"
          git clone --quiet https://github.com/ZengZichao/PyiTOL.git ../PyiTOL
          # 与 test job 同一个引擎 commit，保证"测的"和"打包的"是同一份引擎。
          git -C ../PyiTOL checkout --quiet 10b531ab5aaa5178496a05425b1ed1fc4ed59d86
          # 引擎的 pyproject.toml 位于 PyiTOL 仓库根。原先指向的
          # PyiTOL-项目代码 子目录并不存在，pip 报
          #   Invalid requirement: '../PyiTOL/PyiTOL-项目代码'
          #   Expected package name at the start of dependency specifier
          # pip 要求路径参数是含 pyproject.toml/setup.py 的项目目录，故传仓库根。
          test -f ../PyiTOL/pyproject.toml || { echo "::error::PyiTOL 仓库根缺少 pyproject.toml，路径假设已失效"; exit 1; }
          pip install ../PyiTOL
      - name: Build .app
        run: pyinstaller packaging/pyitolstudio.spec --noconfirm
      - name: Smoke test the bundle
        env:
          PYITOLSTUDIO_SMOKE: "1"
        # app 名含空格，必须加引号；此前 shell 把 "dist/PyiTOL Studio.app/..."
        # 按空格切成 "dist/PyiTOL" + "Studio.app/..."，报
        #   dist/PyiTOL: No such file or directory
        # smoke 模式走 main._smoke()，内部是一串 assert，失败时以非 0 退出。
        run: |
          set -uo pipefail
          APP="dist/PyiTOL Studio.app"
          test -d "$APP" || { echo "::error::未产出 $APP"; ls -la dist/ || true; exit 1; }
          "$APP/Contents/MacOS/PyiTOL Studio"
          rc=$?
          echo "smoke test exit code: $rc"
          exit $rc
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: PyiTOL-Studio-macos
          path: dist/PyiTOL Studio.app
